server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 50m;

  # --- Modern image delivery (no HTML changes needed) ---
  # If the browser supports AVIF/WebP, serve /assets/images/foo.avif or foo.webp
  # when the page requests /assets/images/foo.jpg/.jpeg/.png.
  set $img_ext "";
  if ($http_accept ~* "webp") { set $img_ext ".webp"; }
  if ($http_accept ~* "avif") { set $img_ext ".avif"; }

  # ensure correct MIME type for AVIF (some nginx builds don’t include it by default)


  location ~* ^(/assets/images/.+)\.(?:png|jpe?g)$ {
    add_header Vary Accept;
    try_files $1$img_ext $uri =404;
    access_log off;
    expires 30d;
  }

  # Static legacy assets
  location /assets/ {
    try_files $uri =404;
    access_log off;
    expires 7d;
  }

  # API reverse proxy (recommended when frontend + backend are separate containers)
  # Change "api:4000" to your backend service DNS/name.
  location /api/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Sitemap is generated by the backend from the database
  location = /sitemap.xml {
    proxy_pass http://api:4000/api/public/sitemap.xml;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Uploaded files (covers, etc.) served by the backend
  location /uploads/ {
    proxy_pass http://api:4000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    expires 30d;
    add_header Cache-Control "public";
  }

  # --- SEO: permanent (301) redirects for moved / legacy URLs ---
  location = /info/so-funktionierts { return 301 /info/how-it-works; }
  location = /info/technik          { return 301 /info/how-it-works; }
  location = /info/ausruestung      { return 301 /info/how-it-works; }
  location = /info/beschaffung      { return 301 /info/sourcing; }
  location = /technik.html          { return 301 /info/how-it-works; }
  location = /ausruestung.html      { return 301 /info/how-it-works; }
  location = /beschaffung.html      { return 301 /info/sourcing; }
  location = /faq.html              { return 301 /info/faq; }
  location = /haeufige_fragen.html  { return 301 /info/faq; }
  location = /haeufige_fragen_d.html { return 301 /info/faq; }
  location = /impressum.html        { return 301 /info/impressum; }
  location = /impressum_d.html      { return 301 /info/impressum; }
  location = /datenschutz.html      { return 301 /info/datenschutz; }
  location = /bookthemes.html       { return 301 /bookthemes; }
  location = /recent-highlights     { return 301 /titles; }

  # --- SEO: page-specific <head> tags and a crawler-readable summary ---
  # index.html contains <!--# include virtual="/__seo/head" --> and
  # <!--# include virtual="/__seo/body" -->; nginx fills them from the API.
  # X-Original-URI carries the page path the visitor requested.
  location ^~ /__seo/ {
    internal;
    proxy_pass http://api:4000/api/public/seo/;
    proxy_http_version 1.1;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Original-URI $request_uri;
    proxy_connect_timeout 2s;
    proxy_read_timeout 4s;
  }

  # SPA fallback (index.html is processed with SSI, see above)
  location / {
    ssi on;
    ssi_silent_errors on;
    add_header Cache-Control "no-cache";
    try_files $uri $uri/ /index.html;
  }
}
